name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CARGO_TERM_COLOR: always

jobs:
  check:
    name: fmt, clippy, tests, testbench
    runs-on: macos-latest
    defaults:
      run:
        working-directory: viewer/src-tauri
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: viewer/src-tauri
      - run: cargo fmt --all -- --check
      - run: cargo clippy --all-targets -- -D warnings
      - run: cargo test
      - name: UART decoder and measurements
        run: |
          node ../ui/uart.test.js
          node ../ui/measure.test.js
          node ../ui/buses.test.js
          node ../ui/files.test.js
      - name: logic analyzer testbench
        working-directory: logic_analyzer
        run: |
          brew install icarus-verilog
          iverilog -o "$RUNNER_TEMP/tb" tb.v mojo_top.v
          vvp "$RUNNER_TEMP/tb" | tee "$RUNNER_TEMP/tb.log"
          grep -q PASS "$RUNNER_TEMP/tb.log"
      - name: tools parse
        working-directory: .
        run: |
          sh -n tools/ise.sh
          python3 -m py_compile tools/mojo_load.py
      - name: release scripts
        working-directory: .
        run: .github/scripts/test.sh

  examples:
    name: Arduino examples compile
    # Linux: the AVR toolchain ships x86-only for macOS
    runs-on: ubuntu-latest
    env:
      SPARKFUN: https://raw.githubusercontent.com/sparkfun/Arduino_Boards/main/IDE_Board_Manager/package_sparkfun_index.json
    steps:
      - uses: actions/checkout@v4
      - uses: arduino/setup-arduino-cli@v2
      - run: |
          arduino-cli core update-index --additional-urls "$SPARKFUN"
          arduino-cli core install arduino:avr SparkFun:avr --additional-urls "$SPARKFUN"
      - name: Pro Micro 5 V / 16 MHz and 3.3 V / 8 MHz
        run: |
          for sketch in examples/*/; do
            for b in arduino:avr:leonardo SparkFun:avr:promicro:cpu=8MHzatmega32U4; do
              arduino-cli compile --fqbn "$b" --additional-urls "$SPARKFUN" "$sketch"
            done
          done

  pr-title:
    name: PR title is a Conventional Commit
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      pull-requests: read
    steps:
      - uses: amannn/action-semantic-pull-request@v5
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          types: |
            feat
            fix
            perf
            refactor
            docs
            test
            build
            ci
            chore

  version:
    name: next version
    if: github.event_name == 'push'
    needs: check
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.v.outputs.version }}
      release: ${{ steps.v.outputs.release }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - id: v
        run: |
          v=$(.github/scripts/next-version.sh)
          echo "version=$v" >> "$GITHUB_OUTPUT"
          if git rev-parse -q --verify "refs/tags/v$v" >/dev/null; then echo "release=false" >> "$GITHUB_OUTPUT"; else echo "release=true" >> "$GITHUB_OUTPUT"; fi
          echo "next version: $v"

  build:
    name: Mojo LA ${{ matrix.name }}
    needs: version
    # on PRs this proves the release build still works; on main it feeds the release
    if: ${{ always() && (github.event_name == 'pull_request' || needs.version.outputs.release == 'true') }}
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
        working-directory: viewer/src-tauri
    env:
      VERSION: ${{ needs.version.outputs.version || '0.0.0' }}
    strategy:
      fail-fast: true
      matrix:
        include:
          - { name: macOS, os: macos-latest, target: universal-apple-darwin, rust: "aarch64-apple-darwin,x86_64-apple-darwin", bundles: dmg }
          - { name: Windows, os: windows-latest, target: x86_64-pc-windows-msvc, rust: x86_64-pc-windows-msvc, bundles: "nsis,msi" }
          - { name: Linux, os: ubuntu-22.04, target: x86_64-unknown-linux-gnu, rust: x86_64-unknown-linux-gnu, bundles: "deb,appimage" }
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.rust }}
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: viewer/src-tauri
          key: ${{ matrix.target }}
      - name: Linux webview and udev libraries
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf libudev-dev
      - name: stamp version
        run: |
          sed -i.bak "s/^version = \"0.0.0\"/version = \"$VERSION\"/" Cargo.toml
          sed -i.bak "s/\"version\": \"0.0.0\"/\"version\": \"$VERSION\"/" tauri.conf.json
      - name: build
        run: npx -y @tauri-apps/cli@2 build --target ${{ matrix.target }} --bundles ${{ matrix.bundles }}
      - name: package
        run: |
          mkdir -p ../../dist
          find target/${{ matrix.target }}/release/bundle -maxdepth 2 -type f \
            \( -name '*.dmg' -o -name '*.exe' -o -name '*.msi' -o -name '*.deb' -o -name '*.AppImage' \) |
          while read -r f; do
            asset=$(basename "$f" | tr ' ' '-')
            cp "$f" "../../dist/$asset"
            (cd ../../dist && (sha256sum "$asset" 2>/dev/null || shasum -a 256 "$asset") > "$asset.sha256")
          done
          ls -l ../../dist
          [ -n "$(ls ../../dist)" ]
      - uses: actions/upload-artifact@v4
        if: github.event_name == 'push'
        with:
          name: mojo-la-${{ matrix.target }}
          path: dist/*

  release:
    name: tag and publish release
    needs: [version, build]
    if: ${{ github.event_name == 'push' && needs.version.outputs.release == 'true' }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: changelog
        run: .github/scripts/changelog.sh "${{ needs.version.outputs.version }}" "${{ github.repository }}" | tee notes.md
      - name: create release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "v${{ needs.version.outputs.version }}" dist/* \
            --target "$GITHUB_SHA" --title "v${{ needs.version.outputs.version }}" --notes-file notes.md
